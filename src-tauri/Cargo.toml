[package]
name = "chesspush"
version = "0.2.0-alpha.2"
edition = "2024"

[lib]
name = "chesspush_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
zstd = "0.13"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
sha2 = "0.10"
url = "2"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "chesspush"
required-features = ["desktop"]

[profile.release]
strip = true
lto = "thin"

