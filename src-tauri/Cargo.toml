[package]
name = "chesspush"
version = "0.2.0-alpha.7"
edition = "2024"

[lib]
name = "chesspush_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = "=0.30.0"
shakmaty-syzygy = "=0.28.1"
pgn-reader = "=0.29.1"
regex = "1"
zstd = "0.13"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
sha2 = "0.10"
url = "2"
base64 = "0.22"
getrandom = "0.3"
zeroize = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "native-tls"] }
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "chesspush"
required-features = ["desktop"]

[profile.release]
strip = true
lto = "thin"

